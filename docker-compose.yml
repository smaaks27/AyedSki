version: '3.8'

services:
  spring-boot-app:
    image: "smaxxxxx/spring-boot-app" # Image name passed as argument or fallback to default
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
