version: '3.8'

services:
  spring-boot-app:
    image: "smaxxxxx/spring-boot-app" # Image name passed as argument or fallback to default
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/stationSki
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root_password
    networks:
      - my_custom_network
networks:
  my_custom_network:
    external: true
