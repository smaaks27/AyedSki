version: '3.8'

services:
  spring-boot-app:
    image: "smaxxxxx/spring-boot-app" # Image name passed as argument or fallback to default
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/stationSki
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
    networks:
      - app-network
  mysql-db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: stationSki
    ports:
      - "3306:3306"
    networks:
      - app-network
